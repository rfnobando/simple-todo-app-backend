services:
  app:
    image: python:3.14-slim
    working_dir: /usr/src/app
    ports:
      - ${APP_HOST_PORT}:8000
    restart: no
    volumes:
      - .:/usr/src/app
    networks:
      - todo-app-network
    depends_on: 
      - postgres
    env_file:
      - .env
    command: tail -f /dev/null

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    restart: no
    volumes:
      - todo-app-postgres-data:/var/lib/postgresql
    networks:
      - todo-app-network

networks:
  todo-app-network:

volumes:
  todo-app-postgres-data:
